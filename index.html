$('#nav').innerHTML=navs.map(([id,iconName,title])=>`<button title="${title}" aria-current="${page===id?'page':'false'}" data-page="${id}" class="${page===id?'active':''}"><span class="nav-icon">${icon(iconName)}</span><span class="nav-text">${title}</span>${id==='approvals'&&pending().length?`<span class="count">${pending().length}</span>`:''}</button>`).join('');$('#crumb').textContent=navs.find(n=>n[0]===page)[2];
$('#app').innerHTML=({hub:hub,approvals:approvalView,exceptions:exceptionsView,actions:actionsView,sources:sourcesView}[page])();bind();hydrateIcons();}
function hub(){const actions=data.accounts.flatMap(a=>a.actions),risk=data.accounts.filter(a=>['High Risk','Stalled'].includes(a.signal)).length;return pageHeading('Intelligence hub','The latest conversations, decisions, and next steps. All in one place.',`<button class="button" id="export">${icon('download')} Export snapshot</button><button class="button primary" id="run">${icon('refresh-cw')} Run daily review</button>`)+`<div class="run-banner"><span class="round">${icon('circle-check')}</span><div><strong>Daily intelligence is ready.</strong> ${pending().length} account update${pending().length===1?' awaits':'s await'} your review.<div style="margin-top:4px;font-size:12px;color:#64748b">Last demo run: ${esc(data.lastRun)} · 29 illustrative messages across 7 sample channels</div></div><button class="banner-link" data-page="approvals">Review updates ${icon('arrow-right')}</button></div><div class="stats"><button class="stat" data-stat="all"><div class="stat-label">Accounts tracked <span class="stat-symbol">${icon('layout-dashboard')}</span></div><div class="stat-value">${data.accounts.length.toString().padStart(2,'0')}</div><div class="stat-foot">Across 5 product lines</div></button><button class="stat alert" data-page="exceptions"><div class="stat-label">Need attention <span class="stat-symbol">${icon('triangle-alert')}</span></div><div class="stat-value">${String(risk).padStart(2,'0')}</div><div class="stat-foot">Stalled or high risk accounts</div></button><button class="stat warn" data-page="actions"><div class="stat-label">Open action items <span class="stat-symbol">${icon('list-checks')}</span></div><div class="stat-value">${String(actions.length).padStart(2,'0')}</div><div class="stat-foot"><em style="color:#d97706">${actions.filter(overdue).length} overdue</em> · Across all accounts</div></button><button class="stat" data-page="approvals"><div class="stat-label">Awaiting approval <span class="stat-symbol">${icon('clipboard-check')}</span></div><div class="stat-value">${String(pending().length).padStart(2,'0')}</div><div class="stat-foot"><em>AI proposed</em> · You stay in control</div></button></div><div class="section-head"><div><h2>Your account portfolio</h2><p>A single thread for every customer relationship.</p></div><div class="tabs">${['All accounts','Needs attention'].map(t=>`<button class="tab ${hubTab===t?'active':''}" data-hubtab="${t}">${t}</button>`).join('')}</div></div><div class="table-card"><div class="toolbar"><label class="search">${icon('search')} <input id="search" placeholder="Search accounts, updates, or owners…" aria-label="Search accounts" value="${esc(query)}"></label><div class="filters"><select id="signal" aria-label="Filter by signal">${['All signals','Progressing','Opportunity','Stalled','High Risk'].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select><select id="product" aria-label="Filter by product">${['All products',...new Set(data.accounts.map(a=>a.product))].map(s=>`<option ${s===product?'selected':''}>${s}</option>`).join('')}</select></div></div><div id="account-table">${accountTable()}</div></div><div class="lower-grid"><section class="panel"><div class="panel-head"><h3>Latest account movements</h3><button class="text-link" data-page="approvals">Review all ${icon('arrow-right')}</button></div>${(data.audit.length?data.audit.slice().reverse().slice(0,3).map(a=>({name:a.name,text:a.text,time:'Just now'})):[{name:'CUMI',text:'Pilot scope confirmed. Proposed status change is ready for review.',time:'18:02'},{name:'Hilti India',text:'Legal response progressed. One action proposed as completed.',time:'18:02'},{name:'Piramal Group',text:'Budget review identified. Risk change needs your attention.',time:'18:02'}]).map(a=>`<div class="activity"><span class="activity-icon">${icon('arrow-up-right')}</span><div><strong>${esc(a.name)}</strong><p>${esc(a.text)}</p></div><time>${a.time}</time></div>`).join('')}</section><section class="panel"><div class="panel-head"><h3>Where your intelligence comes from</h3><button class="text-link" data-page="sources">View sources ${icon('arrow-right')}</button></div>${[['Growth & sales','9 messages · 4 accounts'],['Client delivery','8 messages · 3 accounts'],['Account management','5 messages · 3 accounts']].map(([name,sub])=>`<div class="channel-row"><span class="teams-icon">${icon('messages-square')}</span><div>${name}<small>${sub}</small></div><span>Sample source</span></div>`).join('')}<div style="padding:13px 20px;font-size:12px;color:#94a3b8">+ 4 more sample channels · Microsoft Teams integration planned</div></section></div>`}
function visibleAccounts(){return data.accounts.filter(a=>(hubTab!=='Needs attention'||['High Risk','Stalled'].includes(a.signal))&&(filter==='All signals'||a.signal===filter)&&(product==='All products'||a.product===product)&&[a.name,a.owner,a.status,a.product].join(' ').toLowerCase().includes(query.toLowerCase()))}
function accountTable(){const rows=visibleAccounts();return `<div class="table-scroll"><table><thead><tr><th>ACCOUNT</th><th>SIGNAL</th><th>CURRENT STATUS</th><th>OPEN ACTIONS</th><th>ACCOUNT OWNER</th><th>LAST UPDATE</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr tabindex="0" role="button" aria-label="Open ${esc(a.name)}" data-account="${a.id}"><td><div class="company"><span class="logo">${a.initials}</span><div><strong>${a.name}</strong><small>${a.product} · ${a.channels} channels</small></div></div></td><td>${badge(a.signal)}</td><td class="status-cell">${esc(a.status)}</td><td><div class="action-count">${a.actions.length} open ${a.actions.some(overdue)?`<span class="overdue">${a.actions.filter(overdue).length} overdue</span>`:''}</div></td><td>${owner(a.owner)}</td><td class="muted" style="font-size:12px">${a.updated}</td><td style="color:#94a3b8">${icon('chevron-right')}</td></tr>`).join('')}</tbody></table></div>${!rows.length?'<div class="empty">No accounts match these filters.</div>':''}<div class="table-bottom"><span>Showing ${rows.length} of ${data.accounts.length} accounts</span><span>Approved account state · Click an account to explore ${icon('arrow-right')}</span></div>`}
function approvalView(){let p=pending().find(p=>p.id===selected)||pending()[0];if(p)selected=p.id;return pageHeading('Approval queue','Compare the approved account state with today’s proposed updates before they become part of the record.')+`<div class="run-banner"><span class="round">${icon('clipboard-check')}</span><div><strong>${pending().length} updates waiting for a decision.</strong> Approvals update the account view, close completed actions, and preserve the audit history.</div></div>`+(p?`<div class="queue-layout"><div class="queue-list">${pending().map(p=>`<button class="queue-item ${selected===p.id?'active':''}" data-proposal="${p.id}"><div class="company"><span class="logo">${account(p.id).initials}</span><strong>${account(p.id).name}</strong></div><p>${p.close.length} action${p.close.length===1?'':'s'} completed${p.add?' · 1 new action':''}</p>${badge(p.signal)}</button>`).join('')}</div><section class="panel"><div class="panel-head"><div><h2>${account(p.id).name}</h2><p class="subtitle">Daily reconciliation · 18 Nov 2026</p></div><span class="badge ${p.confidence==='High'?'':'stalled'}">${p.confidence==='High'?'High confidence':'Needs review'}</span></div><div class="compare"><div><div class="eyebrow">CURRENT APPROVED STATE</div>${badge(account(p.id).signal)}<h4>Account status</h4><p>${esc(account(p.id).status)}</p><h4>Open actions · ${account(p.id).actions.length}</h4>${account(p.id).actions.map(a=>`<div class="mini-action">${esc(a.text)}<small>${esc(a.owner)} · ${date(a.due)}</small></div>`).join('')}<h4>Recommended next action</h4><p>${esc(account(p.id).next)}</p></div><div><div class="eyebrow">AI PROPOSED UPDATE</div>${badge(p.signal)}<h4>Account status</h4><p>${esc(p.status)}</p><h4>Action reconciliation</h4>${account(p.id).actions.map(a=>`<div class="mini-action ${p.close.includes(a.id)?'closed':''}">${icon(p.close.includes(a.id)?'check-check':'circle')} ${esc(a.text)}<small>${p.close.includes(a.id)?'Completed in today’s messages':'Carried forward · '+date(a.due)}</small></div>`).join('')}${p.add?`<div class="mini-action new">${icon('plus')} ${esc(p.add.text)}<small>${p.add.owner} · ${date(p.add.due)} · New action</small></div>`:''}<h4>Recommended next action</h4><p>${esc(p.next)}</p>${p.reason?`<div class="note">${esc(p.reason)}</div>`:''}</div></div><div style="padding:15px 24px;border-top:1px solid var(--line)"><button class="evidence-link" data-evidence="${p.id}">${icon('file-text')} Review ${p.sources.length} supporting source message${p.sources.length>1?'s':''} ${icon('arrow-right')}</button></div><div class="review-footer"><span class="muted" style="font-size:12px">Changes apply only after approval.</span><button class="button danger" data-decision="reject" data-id="${p.id}">${icon('x')} Reject update</button><button class="button primary" data-decision="approve" data-id="${p.id}">${icon('check')} Approve changes</button></div></section></div>`:`<div class="panel empty"><h2>All updates reviewed</h2><p style="margin:14px">Your approved account views are up to date. Rejected proposals remain in the review history.</p><button class="button" data-page="hub">Return to intelligence hub</button></div>`)+reviewHistory()}
function reviewHistory(){return data.audit.length?`<section class="panel" style="margin-top:24px"><div class="panel-head"><h3>Review history</h3></div>${data.audit.slice().reverse().map(a=>`<div class="activity"><span class="activity-icon">${icon(a.decision==='approve'?'check':'x')}</span><div><strong>${esc(a.name)}</strong><p>${esc(a.text)} · Reviewed by Debajyoti Dasgupta</p></div><time>${esc(a.time)}</time></div>`).join('')}</section>`:''}
function decide(id,decision){const p=proposals.find(p=>p.id===id),a=account(id);if(data.decisions[id])return;if(decision==='approve'){a.status=p.status;a.signal=p.signal;a.next=p.next;a.closed.push(...a.actions.filter(x=>p.close.includes(x.id)));a.actions=a.actions.filter(x=>!p.close.includes(x.id));if(p.add)a.actions.push(structuredClone(p.add));a.events.unshift(p.event);a.updated='18 Nov · Approved';}data.decisions[id]=decision;data.audit.push({name:a.name,text:decision==='approve'?'Approved daily changes and reconciled action items.':'Rejected proposed update; approved account state retained.',decision,time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'})+' IST'});save();render();toast(decision==='approve'?`${a.name} updated. Audit history preserved.`:`${a.name} proposal rejected.`)}
function exceptionsView(){const list=data.accounts.filter(a=>['Stalled','High Risk'].includes(a.signal));return pageHeading('Executive exceptions','A focused view of stalled accounts, risk signals, and the next intervention.',`<button class="button" id="export">${icon('download')} Export snapshot</button>`)+`<div class="run-banner"><span class="round">${icon('triangle-alert')}</span><div><strong>${list.length} accounts require attention.</strong> Based on approved state, including unresolved risks from previous days.</div><button class="banner-link" data-page="approvals">${pending().length} proposals pending ${icon('arrow-right')}</button></div><div class="exception-grid">${list.map(a=>`<section class="panel exception"><div class="company"><div style="display:flex;align-items:center;gap:12px"><span class="logo">${a.initials}</span><div><h2>${a.name}</h2><small class="muted">${a.product}</small></div></div>${badge(a.signal)}</div><p>${a.status}</p><div class="next-action"><small>Recommended intervention</small>${a.next}</div><div class="exception-bottom">${owner(a.owner)}<span class="overdue">${a.actions.filter(overdue).length} overdue actions</span><button class="text-link" data-account="${a.id}">Open account ${icon('arrow-right')}</button></div></section>`).join('')||'<section class="panel empty">No approved accounts currently require escalation.</section>'}</div>`}
function actionsView(){const list=data.accounts.flatMap(a=>(actionTab==='Completed'?a.closed:a.actions).map(x=>({...x,account:a.name,aid:a.id}))).filter(a=>(actionTab!=='Overdue'||overdue(a))&&[a.text,a.owner,a.account].join(' ').toLowerCase().includes(query.toLowerCase()));return pageHeading('Action tracker','Track ownership, deadlines, and progress across accounts. Completion is reconciled through review.')+`<div class="section-head"><h2>Account actions</h2><div class="tabs">${['Open','Overdue','Completed'].map(t=>`<button class="tab ${actionTab===t?'active':''}" data-actiontab="${t}">${t}</button>`).join('')}</div></div><section class="table-card"><div class="toolbar"><label class="search">${icon('search')} <input id="action-search" placeholder="Search actions, accounts, or owners…" aria-label="Search action items" value="${esc(query)}"></label><span class="muted" style="font-size:12px;padding:8px">${list.length} ${actionTab.toLowerCase()} actions</span></div><div class="table-scroll"><table class="action-table"><thead><tr><th>ACTION ITEM</th><th>ACCOUNT</th><th>OWNER</th><th>DUE DATE</th><th>STATUS</th></tr></thead><tbody>${list.map(a=>`<tr data-account="${a.aid}"><td style="min-width:280px">${esc(a.text)}</td><td>${a.account}</td><td>${esc(a.owner)}</td><td>${date(a.due)} 2026</td><td>${actionTab==='Completed'?'<span class="badge">Completed</span>':overdue(a)?'<span class="badge high-risk">Overdue</span>':'<span class="badge">Open</span>'}</td></tr>`).join('')}</tbody></table></div>${!list.length?'<div class="empty">No actions match this view.</div>':''}</section>`}
function sourcesView(){return pageHeading('Sources & daily runs','Inspect the daily review workflow and the channels included in this demonstration.',`<button class="button primary" id="run">${icon('refresh-cw')} Simulate daily review</button>`)+`<div class="settings-grid"><section class="panel"><div class="panel-head"><h2>Daily review</h2><span class="badge">Demo mode</span></div><div class="setting-body"><p>Collect new messages, match known accounts, compare against approved state, then prepare changes for review.</p><label>Proposed production schedule</label><input value="Daily at 18:00 · Asia/Kolkata" readonly><label>Demonstration review window</label><input value="17 Nov 18:00 to 18 Nov 18:00 IST" readonly><div class="note">This prototype simulates reconciliation in your browser. There is no live Teams ingestion, scheduled job, LLM call, or CRM write-back. Decisions persist in this browser.</div></div></section><section class="panel"><div class="panel-head"><h2>Microsoft 365 workflow</h2></div><div class="setting-body"><p><strong>The attached specification</strong><br>Microsoft Lists stores account state and version history. Power Automate ingests Teams messages and AI Builder proposes reconciled changes.</p><p style="margin-top:16px"><strong>Approval and delivery</strong><br>Power Automate routes proposed account changes for approval before updating Microsoft Lists. Teams or Outlook delivers the executive exception report.</p><div class="note">Before production: add Microsoft sign-in, channel permissions, account aliases, source links, stable action IDs, retries, duplicate protection, and version checks on approval.</div></div></section><section class="panel"><div class="panel-head"><h2>Sample Teams channels</h2><span class="muted" style="font-size:12px">29 messages</span></div>${[['Growth & sales',9],['Client delivery',8],['Account management',5],['Legal & security',3],['Product & engineering',2],['Customer success',1],['Leadership updates',1]].map(([n,c])=>`<div class="channel-row"><span class="teams-icon">${icon('messages-square')}</span><div>${n}<small>Illustrative source · Not connected</small></div><span>${c} messages</span></div>`).join('')}</section><section class="panel"><div class="panel-head"><h2>Run & review history</h2></div><div class="setting-body"><div class="eyebrow">LAST SIMULATED RUN</div><p>${esc(data.lastRun)}</p><div class="run-step">${icon('check')} 7 channels · 29 sample messages collected</div><div class="run-step">${icon('check')} 3 account proposals prepared</div><div class="run-step">${icon(pending().length?'clock-3':'check')} ${pending().length} awaiting human review</div><div class="note">Accounts with no new messages retain their existing status and unresolved actions. Exceptions include older unresolved risks.</div><button class="button danger" id="reset" style="margin-top:20px">Reset demonstration data</button></div></section></div>`}
function openAccount(id,tab='Actions'){const a=account(id);drawerTab=tab;$('#overlay').innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-label="${a.name} account intelligence"><div class="drawer-head"><div class="company"><span class="logo">${a.initials}</span><div><h2>${a.name}</h2><small>${a.product} · ${a.channels} source channels</small></div></div><button class="close" aria-label="Close">${icon('x')}</button></div><div class="drawer-body"><div style="display:flex;align-items:center;justify-content:space-between">${badge(a.signal)}${owner(a.owner)}</div><div class="detail-summary"><div class="eyebrow">CURRENT APPROVED STATUS</div>${a.status}</div><div class="next-action"><small>Recommended next action</small>${a.next}</div>${pending().some(p=>p.id===id)?`<div class="note">Today’s proposed changes are pending approval. <button class="evidence-link" id="review-account" data-id="${id}">Review update ${icon('arrow-right')}</button></div>`:''}<div class="detail-tabs">${['Actions','Today’s updates','Timeline','Sources'].map(t=>`<button class="${tab===t?'active':''}" data-detailtab="${esc(t)}" data-id="${id}">${t}</button>`).join('')}</div><div style="padding-top:20px">${detailContent(a,tab)}</div></div></section>`;bindOverlay();}
function detailContent(a,tab){const p=proposals.find(p=>p.id===a.id);if(tab==='Actions')return `<div class="eyebrow">OPEN ACTIONS · ${a.actions.length}</div>${a.actions.map(x=>`<div class="detail-action"><span class="check"></span><div><p>${esc(x.text)}</p><small>${x.owner} · Due ${date(x.due)} 2026 ${overdue(x)?'<span class="overdue">Overdue</span>':''}</small></div></div>`).join('')||'<p class="muted">No open actions.</p>'}<div class="eyebrow" style="margin-top:30px">COMPLETED ACTIONS · ${a.closed.length}</div>${a.closed.map(x=>`<div class="detail-action"><span class="check">${icon('check')}</span><div><p>${x.text}</p><small>${x.owner} · Completion retained in account history</small></div></div>`).join('')||'<p class="muted" style="font-size:12px">No completed actions recorded.</p>'}`;if(tab==='Timeline')return `<div class="eyebrow">ACCOUNT HISTORY</div><div class="timeline">${a.events.map((e,i)=>`<div>${esc(e)}<small>${i===0?'Latest approved account event':'Historical approved event'}</small></div>`).join('')}</div>`;if(tab==='Sources')return p?sourceCards(p):`<div class="empty">No detailed source excerpts are included for this sample account.</div>`;return p?`<div class="eyebrow">18 NOVEMBER · ${data.decisions[a.id]==='approve'?'APPROVED':data.decisions[a.id]==='reject'?'REJECTED PROPOSAL':'PENDING APPROVAL'}</div><div class="detail-summary">${p.status}</div>${sourceCards(p)}`:`<div class="detail-summary">${a.events[0]}</div><p class="muted" style="font-size:12px">Latest update is included in the approved account record.</p>`}
function sourceCards(p){return p.sources.map(s=>`<article class="source-card"><div class="source-meta"><span class="teams-icon">${icon('messages-square')}</span><strong>${esc(s.channel)}</strong><span style="margin-left:auto">18 Nov · ${s.time} IST</span></div><p>“${esc(s.text)}”</p><div class="source-meta">${esc(s.author)} <span style="margin-left:auto">Illustrative Teams message</span></div></article>`).join('')}
function evidence(id){const p=proposals.find(p=>p.id===id);$('#overlay').innerHTML=`<section class="drawer" role="dialog" aria-modal="true" aria-label="Supporting messages"><div class="drawer-head"><div><h2>Evidence behind the update</h2><p class="subtitle">${account(id).name} · Sample Teams excerpts</p></div><button class="close" aria-label="Close">${icon('x')}</button></div><div class="drawer-body">${sourceCards(p)}<div class="note">Only explicit evidence supports action completion. Unresolved actions carry forward; risk classification remains a reviewable interpretation.</div></div></section>`;bindOverlay()}
function closeOverlay(){$('#overlay').innerHTML='';}function bindOverlay(){$('.close')?.focus();document.querySelectorAll('.close').forEach(b=>b.onclick=closeOverlay);document.querySelectorAll('[data-detailtab]').forEach(b=>b.onclick=()=>openAccount(b.dataset.id,b.dataset.detailtab));$('#review-account')?.addEventListener('click',e=>{selected=e.currentTarget.dataset.id;closeOverlay();go('approvals')})}
function info(){ $('#overlay').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-label="About the proof of concept"><button class="close" aria-label="Close">${icon('x')}</button><div class="eyebrow">ACCOUNT INTELLIGENCE · FRONT-END POC</div><h2>About account intelligence</h2><p>This application demonstrates account consolidation, daily change proposals, action reconciliation, source evidence, leadership exceptions, and an audit trail.</p><p style="margin-top:14px">All accounts and messages shown here are illustrative. Approval and rejection work locally and persist in this browser. The application complements your CRM.</p><div class="note">To explore: open CUMI, review its source messages, then approve its update in the approval queue. The account signal, actions, history, and exception report will refresh together.</div></section></div>`;bindOverlay()}
async function run(){if(data.ran){toast('This sample day has already been processed. Existing decisions are preserved.');return;}$('#overlay').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-label="Simulating daily review"><div class="eyebrow">SIMULATED DAILY RECONCILIATION</div><h2>Building today’s account view…</h2><p>Comparing sample conversations with the approved state.</p><div id="run-skeleton" aria-label="Preparing account updates"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div id="steps" aria-live="polite"></div></section></div>`;for(const step of ['Collected 29 messages across 7 sample channels','Matched account mentions and existing action IDs','Carried forward unresolved commitments','Prepared 3 proposals for human review']){await new Promise(r=>setTimeout(r,450));$('#steps')?.insertAdjacentHTML('beforeend',`<div class="run-step">${icon('check')} ${step}</div>`)}$('#run-skeleton')?.remove();await new Promise(r=>setTimeout(r,350));data.ran=true;data.lastRun='18 Nov 2026 · 18:02 IST';save();closeOverlay();go('approvals');toast('Demo review complete. Existing approvals remain unchanged.')}
function exportSnapshot(){const rows=[['Account','Product','Signal','Current status','Recommended next action','Open actions','Owner','Deadline'],...data.accounts.flatMap(a=>a.actions.length?a.actions.map(x=>[a.name,a.product,a.signal,a.status,a.next,x.text,x.owner,x.due]):[[a.name,a.product,a.signal,a.status,a.next,'','','']])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='Account_Intelligence_Snapshot_2026-11-18.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Approved account snapshot exported.')}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-account]').forEach(b=>{b.onclick=()=>openAccount(b.dataset.account);b.onkeydown=e=>{if(e.key==='Enter')openAccount(b.dataset.account)}});document.querySelectorAll('[data-hubtab]').forEach(b=>b.onclick=()=>{hubTab=b.dataset.hubtab;render()});document.querySelectorAll('[data-actiontab]').forEach(b=>b.onclick=()=>{actionTab=b.dataset.actiontab;query='';render()});document.querySelectorAll('[data-proposal]').forEach(b=>b.onclick=()=>{selected=b.dataset.proposal;render()});document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>evidence(b.dataset.evidence));document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>decide(b.dataset.id,b.dataset.decision));$('#run')?.addEventListener('click',run);$('#export')?.addEventListener('click',exportSnapshot);$('#search')?.addEventListener('input',e=>{query=e.target.value;$('#account-table').innerHTML=accountTable();document.querySelectorAll('[data-account]').forEach(b=>{b.onclick=()=>openAccount(b.dataset.account);b.onkeydown=e=>{if(e.key==='Enter')openAccount(b.dataset.account)}})});$('#signal')?.addEventListener('change',e=>{filter=e.target.value;render()});$('#product')?.addEventListener('change',e=>{product=e.target.value;render()});$('#action-search')?.addEventListener('input',e=>{const pos=e.target.selectionStart;query=e.target.value;render();$('#action-search').focus();$('#action-search').setSelectionRange(pos,pos)});$('[data-stat="all"]')?.addEventListener('click',()=>{hubTab='All accounts';query='';filter='All signals';render()});$('#reset')?.addEventListener('click',()=>{$('#overlay').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-label="Reset demonstration"><button class="close" aria-label="Close">${icon('x')}</button><h2>Reset demonstration data?</h2><p>This clears local review decisions and restores the sample account records.</p><button class="button primary" id="confirm-reset" style="margin-top:20px">Reset sample workspace</button></section></div>`;bindOverlay();$('#confirm-reset').onclick=()=>{localStorage.removeItem('account-intel-v1');location.reload()}})}
$('#help').onclick=info;$('#profile').onclick=info;$('#overlay').onclick=e=>{if(e.target===$('#overlay')||e.target.classList.contains('modal-wrap'))closeOverlay()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});render();

// Navigation and global search are shared across all modules.
function hydrateIcons(){document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon)});}
function setSidebar(collapsed){document.body.classList.toggle('collapsed',collapsed);$('#collapse').setAttribute('aria-expanded',String(!collapsed));$('#collapse').setAttribute('aria-label',collapsed?'Expand sidebar':'Collapse sidebar');$('#collapse').innerHTML=icon(collapsed?'panel-left-open':'panel-left-close')+'<span class="collapse-label">'+(collapsed?'Expand sidebar':'Collapse sidebar')+'</span>';try{localStorage.setItem('account-intel-sidebar',collapsed?'collapsed':'expanded')}catch{}}
$('#collapse').onclick=()=>{if(window.innerWidth<=650){$('.sidebar').classList.remove('mobile-open');return}setSidebar(!document.body.classList.contains('collapsed'))};
$('#mobile-menu').onclick=()=>$('.sidebar').classList.toggle('mobile-open');
$('#user-menu').onclick=info;
$('.brand').onclick=e=>{e.preventDefault();go('hub')};
let globalMatches=[];
function closeSearch(){$('#global-results').hidden=true;$('#global-search').setAttribute('aria-expanded','false')}
function globalSearch(){const q=$('#global-search').value.trim().toLowerCase();if(!q){closeSearch();return}globalMatches=[];for(const a of data.accounts){if([a.name,a.product,a.owner,a.status].join(' ').toLowerCase().includes(q))globalMatches.push({id:a.id,tab:'Actions',title:a.name,sub:a.product+' · '+a.owner,type:'building-2'});for(const x of a.actions){if([x.text,x.owner].join(' ').toLowerCase().includes(q))globalMatches.push({id:a.id,tab:'Actions',title:x.text,sub:a.name+' · '+x.owner+' · '+date(x.due),type:'list-checks'})}}globalMatches=globalMatches.slice(0,8);$('#global-results').hidden=false;$('#global-search').setAttribute('aria-expanded','true');$('#global-results').innerHTML='<div class="eyebrow" style="padding:8px 12px;margin:0">ACCOUNTS & OPEN ACTIONS</div>'+(globalMatches.length?globalMatches.map((m,i)=>`<button data-global-index="${i}">${icon(m.type)}<span>${esc(m.title)}<small>${esc(m.sub)}</small></span>${icon('chevron-right')}</button>`).join(''):'<div class="empty" style="padding:25px">No matching accounts or actions.</div>');document.querySelectorAll('[data-global-index]').forEach(b=>b.onclick=()=>chooseSearch(Number(b.dataset.globalIndex)));}
function chooseSearch(i){const m=globalMatches[i];if(!m)return;closeSearch();$('#global-search').value='';openAccount(m.id,m.tab)}
$('#global-search').oninput=globalSearch;$('#global-search').onfocus=()=>{if($('#global-search').value)globalSearch()};
$('#global-search').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();$('#global-results button')?.focus()}if(e.key==='Enter'){e.preventDefault();chooseSearch(0)}};
$('#global-results').onkeydown=e=>{const all=[...document.querySelectorAll('[data-global-index]')];const idx=all.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();all[(idx+1)%all.length]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();if(idx===0)$('#global-search').focus();else all[idx-1]?.focus()}};
document.addEventListener('click',e=>{if(!e.target.closest('.global-search-wrap'))closeSearch()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();$('.sidebar').classList.remove('mobile-open')}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!$('#overlay').children.length){e.preventDefault();$('#global-search').focus()}if(e.key==='Tab'&&$('#overlay').children.length){const focusables=[...$('#overlay').querySelectorAll('button,input,select,textarea,a[href],[tabindex="0"]')].filter(el=>!el.disabled);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
try{setSidebar(localStorage.getItem('account-intel-sidebar')==='collapsed')}catch{setSidebar(false)}
hydrateIcons();

</script></body></html>
